<title id="lclt">AirDial: left click</title>
<desc id="lcld">Close-up of the pointing hand from the thumb side: the thumb tip lifts and taps the middle finger's first knuckle (DIP, the joint nearest the fingertip). On the screen the Save button is clicked.</desc>
