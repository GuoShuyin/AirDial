<title id="sclt">AirDial: scroll</title>
<desc id="scld">Close-up of the pointing hand from the thumb side: the thumb slides along the curled middle finger. Towards the fingertip scrolls up, back towards the palm scrolls down. On the screen a web page scrolls up.</desc>
